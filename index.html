<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carnet d'observation nature</title>
<meta name="theme-color" content="#3D6A4A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-192.png">
<script>window.CARNET_LOCAL=true</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Un carnet de terrain : papier chaud, aquarelles de l'utilisatrice, vert forêt pour l'action.
   Mise en page : une colonne étroite (téléphone d'abord), qui s'élargit en grille sur tablette. */
:root{
  --paper:#F7F3EA;
  --card:#FFFDF8;
  --ink:#2E3830;
  --muted:#6B7369;
  --line:#E4DCCB;
  --forest:#3D6A4A;
  --forest-tint:#E4EEE0;
  --corps:#D6A436; --coeur:#CC5848; --tete:#6A96C3; --esprit:#8968AD;
  --eO:#86AE63; --eE:#D6A436; --eP:#6A96C3; --eA:#8968AD;
  --danger:#B4483A;
  --font-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --r:14px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:.01em}
img{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--forest);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.top{position:relative}
.top .banner{width:100%;height:96px;object-fit:cover;object-position:center 60%}
.top .bar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.top .bar img{width:34px;height:34px}
.top .bar h1{font-size:1.35rem;flex:1}
.crumbs{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;padding:10px 16px 0;font-size:.92rem;color:var(--muted)}
.crumbs a{color:var(--forest);text-decoration:none;font-weight:600}
.crumbs span.sep{opacity:.5}
main{max-width:980px;margin:0 auto;padding:12px 16px 100px;display:flex;flex-direction:column;gap:16px}
.notice{background:#FFF4D9;border:1px solid #EBD49B;border-radius:10px;padding:8px 12px;font-size:.92rem}
.notice.err{background:#FBE6E2;border-color:#E9B3A9}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:600;cursor:pointer;min-height:40px}
.btn:hover{border-color:var(--forest)}
.btn.primary{background:var(--forest);border-color:var(--forest);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--forest);padding:6px 8px}
.btn.danger{color:var(--danger)}
.btn img{width:28px;height:28px}
.btn.big{padding:8px 16px 8px 8px}
.btn.big img{width:40px;height:40px}
.row-actions{display:flex;flex-wrap:wrap;gap:8px}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.label{font-size:.78rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* Groupes */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px;cursor:pointer;text-decoration:none;color:inherit}
.tile:hover{border-color:var(--forest)}
.tile img{width:84px;height:84px;object-fit:contain}
.tile h3{font-size:1.2rem}
.tile .meta{font-size:.84rem;color:var(--muted)}
.tile.add{border-style:dashed;justify-content:center;color:var(--forest);font-weight:600;min-height:150px}
.tile.add .plus{font-size:2rem;line-height:1}
.ghead{display:flex;gap:14px;align-items:center}
.ghead img{width:72px;height:72px;object-fit:contain}
.ghead h2{font-size:1.8rem}

/* Enfant */
.chead{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.chead .av{width:58px;height:58px;object-fit:contain}.chead h2 .gear{width:30px;height:30px;margin-left:8px;vertical-align:middle}
.chead .who{flex:1;min-width:160px}
.chead h2{font-size:1.7rem;display:flex;align-items:center}.chead{padding-top:12px;padding-bottom:12px}
.obsdate{display:flex;flex-direction:column;gap:4px}
.obsdate input{border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:#fff}
.secgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.sectile{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;cursor:pointer;text-decoration:none;color:inherit}
.sectile:hover{border-color:var(--forest)}
.sectile img{width:56px;height:56px;object-fit:contain;flex:none}
.sectile h3{font-size:1.12rem}
.sectile .meta{font-size:.84rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar-prog{height:6px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}
.bar-prog i{display:block;height:100%;background:var(--forest)}
.dots{display:inline-flex;gap:4px;vertical-align:middle;margin-left:4px}
.dot{width:9px;height:9px;border-radius:50%}
.d-corps{background:var(--corps)}.d-coeur{background:var(--coeur)}.d-tete{background:var(--tete)}.d-esprit{background:var(--esprit)}

.sechead{display:flex;gap:12px;align-items:center}
.sechead img{width:68px;height:68px;object-fit:contain}
.sechead h2{font-size:1.7rem}
.sechead .sph{font-size:.88rem;color:var(--muted)}
.secnav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.secnav a{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 3px;background:var(--card);text-decoration:none;color:inherit;font-size:.88rem;font-weight:600}
.secnav a img{width:28px;height:28px;object-fit:contain}
.secnav a.on{border-color:var(--forest);background:var(--forest-tint)}

.obsrow{display:flex;flex-direction:column;gap:10px;padding:14px 0;border-top:1px solid var(--line)}
.obsrow:first-of-type{border-top:0;padding-top:4px}
.obsrow h4{font-size:1.15rem}
.obsrow .hint{font-size:.88rem;color:var(--muted);margin-top:2px}
.steps{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.step{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 10px 7px 30px;cursor:pointer;max-width:100%;flex:1 1 100%;width:100%}
.step::before{content:"";position:absolute;left:9px;top:10px;width:14px;height:14px;border:1.5px solid #B8AF9C;border-radius:4px;background:#fff}
.step .n{font-size:.72rem;font-weight:700;color:var(--muted);letter-spacing:.05em}
.step .t{font-size:.93rem;line-height:1.3}
.step .d{font-size:.8rem;font-weight:700;color:var(--forest);font-variant-numeric:tabular-nums}
.step.on{background:var(--forest-tint);border-color:var(--forest)}
.step.on::before{background:var(--forest);border-color:var(--forest)}
.step.on::after{content:"";position:absolute;left:13px;top:12px;width:5px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.eng{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.eng .lbl{font-size:.82rem;color:var(--muted);margin-right:2px}
.sbtn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:600;font-size:.88rem}
.sbtn:hover{border-color:var(--forest)}
.sbtn.on{background:var(--forest);border-color:var(--forest);color:#fff}
.ehist{display:flex;flex-wrap:wrap;gap:4px}
.spill{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:600;border-radius:999px;padding:1px 3px 1px 8px;background:#F1EADB;color:var(--ink);font-variant-numeric:tabular-nums}
.spill button{border:0;background:transparent;color:var(--muted);cursor:pointer;width:18px;height:18px;padding:0}

.hands{display:flex;flex-direction:column;gap:6px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.hitem{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:4px 0;border-top:1px dashed var(--line)}
.hitem:first-child{border-top:0}
.hname{font-weight:600;font-size:.93rem;min-width:110px}
.hbtns{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.hbtn{border:0;border-left:1px solid var(--line);background:#fff;padding:5px 12px;font-weight:700;cursor:pointer;min-width:40px}
.hbtn:first-child{border-left:0}
.hbtn.on{background:var(--forest);color:#fff}
.hpill{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:600;border-radius:999px;padding:1px 3px 1px 8px;background:var(--forest-tint);color:var(--forest);font-variant-numeric:tabular-nums}
.hpill button{border:0;background:transparent;color:var(--forest);cursor:pointer;width:18px;height:18px;padding:0}
.kid{display:flex;flex-direction:column;gap:4px}
.kidhead{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.kidhead img{width:48px;height:48px;object-fit:contain}
.kidhead h3{font-size:1.35rem}
.act .obsrow{padding:10px 0}
.act .step{padding:6px 8px 6px 28px}
.act .step .n{display:none}
.act .step::before{top:8px}.act .step.on::after{top:10px}
.quick{display:flex;gap:6px;align-items:flex-start}
.quick textarea{flex:1;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;resize:vertical}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.toolbar select{border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:#fff}
.sugg{display:flex;flex-direction:column;gap:4px;font-size:.88rem;background:var(--forest-tint);border-radius:8px;padding:6px 8px}
.sugg label{display:flex;gap:6px;align-items:flex-start}
.obsrow.rep .step{border-style:dashed}
.obsrow.rep .step.on{border-style:solid}
.step .d em{font-style:normal;font-weight:500;color:var(--muted)}
.ctx input{min-width:200px}
details.more{border-top:1px solid var(--line);margin-top:8px;padding-top:8px}
details.more>summary{cursor:pointer;font-weight:600;color:var(--forest);list-style:none;padding:6px 0}
details.more>summary::before{content:"▸ ";}
details.more[open]>summary::before{content:"▾ ";}
.hidebtn{font-size:.82rem!important;font-weight:600}
.cov-wrap{overflow-x:auto}
.cov{border-collapse:separate;border-spacing:3px;font-size:.84rem;font-variant-numeric:tabular-nums}
.cov th{font-weight:600;text-align:left;white-space:nowrap;padding:2px 6px}
.cov thead th{text-align:center;vertical-align:bottom;font-size:.72rem;color:var(--muted);font-weight:600}
.cov thead th img{width:32px;height:32px;margin:0 auto 2px;object-fit:contain}
.cov thead th span{display:block}
.cov th a{color:var(--ink);text-decoration:none}
.cov td{text-align:center;border-radius:8px;min-width:54px;padding:0}
.cov td a{display:block;padding:7px 4px;color:inherit;text-decoration:none}
.cov .c3{background:#D9EBD3;color:#2C5A38;font-weight:700}
.cov .c2{background:#F6E9C6;color:#7A5A12}
.cov .c1{background:#F6DED8;color:#8C3A2E}
.cov .c0{background:#F0ECE3;color:var(--muted)}
.lvl{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.lvlbadge{display:inline-block;font-size:.72rem;font-weight:700;color:#7A5A12;background:#F6E9C6;border-radius:999px;padding:1px 7px}
.cam{vertical-align:-2px}
.phc{display:inline-flex;align-items:center;gap:3px;font-size:.78rem;font-weight:700;color:var(--forest)}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.thumb{width:72px;height:72px;border:1px solid var(--line);border-radius:10px;padding:0;overflow:hidden;background:#EEE8DC;cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb.old{position:relative;border:2px dashed #C9AE7C;opacity:.9}
.thumb .phd{position:absolute;left:3px;right:3px;bottom:3px;font-size:.62rem;line-height:1.3;background:rgba(255,252,243,.88);border-radius:6px;text-align:center;color:#6B5A3A}
.thumb.more{display:flex;align-items:center;justify-content:center;text-decoration:none;color:#6B5A3A;font-weight:600;border:2px dashed #C9AE7C;background:#FBF6EA}
.thumb.broken img{display:none}
.bigphoto{width:100%;max-height:70vh;object-fit:contain;border-radius:12px;background:#EEE8DC}
.entry.col{flex-direction:column;align-items:stretch}
.entry .erow{display:flex;align-items:center;gap:8px}
.photos{margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
label.btn{cursor:pointer}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:.92rem}
.chk input{margin-top:3px}
.secnav.wrap{flex-wrap:wrap;overflow:visible}
.subnav{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;padding:8px;background:var(--forest-tint);border-radius:12px}
.subnav a{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;text-decoration:none;color:inherit;font-size:.88rem;font-weight:600}
.subnav a.on{background:var(--forest);border-color:var(--forest);color:#fff}
.subtitle{font-family:var(--font-display);font-size:1.15rem;color:var(--forest);font-weight:600;margin-top:2px}
.sectile .subs{font-size:.8rem;color:var(--muted);margin-top:1px}
.more-btn{flex:1 1 100%;border:1px dashed var(--forest);background:transparent;color:var(--forest);border-radius:10px;padding:7px 10px;font-weight:600;cursor:pointer}
.custtag{display:inline-block;font-size:.7rem;font-weight:700;color:var(--forest);background:var(--forest-tint);border-radius:999px;padding:0 6px;margin-left:6px}
.prow{padding:10px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow h4{font-size:1.08rem}
.plist{list-style:none;margin:6px 0;padding:0;display:flex;flex-direction:column;gap:3px}
.plist li{display:flex;gap:6px;align-items:center;font-size:.92rem}
.plist li .x{border:0;background:transparent;color:var(--danger);cursor:pointer;font-size:.95rem}
.gear{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-weight:600;text-decoration:none;color:var(--forest);font-size:.88rem}
.rnotes{display:flex;flex-direction:column;gap:6px}
.notebtn{align-self:flex-start;border:0;background:transparent;color:var(--forest);font-weight:600;cursor:pointer;padding:2px 0;font-size:.9rem}
.mic.on{color:#fff;background:var(--danger);border-color:var(--danger)}
.objrow{padding:10px 0;border-top:1px solid var(--line)}
.objrow:first-of-type{border-top:0}
.objhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.kids{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px 4px}
.alpick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-height:52vh;overflow:auto}.alitem{display:flex;flex-direction:column;gap:4px}.alth{position:relative;display:block;aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:#eee}.alth img{width:100%;height:100%;object-fit:cover}.alth input{position:absolute;top:6px;right:6px;width:22px;height:22px}
.kids.kp{gap:5px}.kpill{position:relative;display:flex;align-items:center;justify-content:center;gap:3px;min-width:0;height:34px;padding:0 3px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font:inherit;font-size:.78rem;letter-spacing:-.1px;font-weight:600;color:var(--ink,#2a2a2a);cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.kpill .kn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.kpill .sym{font-weight:700}.kpill .nd{position:absolute;top:2px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--forest,#2C5A38)}
.kpill.prog{border-color:#E2B65A;background:#FFF1C9;color:#8A6500}.kpill.ok{border-color:#4E8A5C;background:#E4F0E0;color:#2F5E3A}.kpill.no{border-color:#C66A5A;background:#F8E3DE;color:#8A3B2E}
.kchip{display:flex;flex-direction:column;align-items:center;min-width:0}
.kmark{position:relative;width:50px;height:50px;border-radius:50%;border:2px solid var(--line);background:#fff;padding:3px;cursor:pointer}
.kmark img{width:100%;height:100%;object-fit:contain}
.kmark .sym{position:absolute;right:-4px;bottom:-4px;min-width:22px;height:22px;border-radius:50%;font-weight:700;font-size:.85rem;line-height:22px;color:#fff}
.kchip.ok .kmark{border-color:#4E8A5C;background:#E4F0E0}.kchip.ok .sym{background:#4E8A5C}
.kchip.no .kmark{border-color:#C66A5A;background:#F8E3DE}.kchip.no .sym{background:#C66A5A}
.kname{border:0;background:transparent;font-size:.74rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;color:var(--forest);cursor:pointer;text-align:center;padding:3px 0;line-height:1.2;text-decoration:underline;text-decoration-color:var(--line)}
.opill{font-size:.78rem;font-weight:600;border-radius:999px;padding:1px 8px}
.opill.ok{background:#E4F0E0;color:#2C5A38}.opill.no{background:#F8E3DE;color:#8C3A2E}
details.pdet>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
details.pdet>summary::-webkit-details-marker{display:none}
details.pdet>summary .ptitle{font-family:var(--font-display);font-size:1.25rem;font-weight:600}
details.pdet>summary .ptitle::before{content:"▸ ";color:var(--forest)}
details.pdet[open]>summary .ptitle::before{content:"▾ "}
.by{font-size:.78rem;color:var(--muted);font-weight:600}
.entry.done .txt{text-decoration:line-through;color:var(--muted)}
.btn.small{font-size:.8rem;min-height:30px;padding:4px 8px}
.presl{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:4px}
.ritem select[hidden]{display:none}
.before{font-size:.85rem;color:var(--muted);background:#F3EEE3;border-radius:8px;padding:6px 8px;text-decoration:line-through;text-decoration-color:rgba(0,0,0,.25)}
.rhead{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.ricons{display:inline-flex;gap:2px;flex:none}
.ico{border:1px solid var(--line);background:#fff;color:var(--forest);border-radius:999px;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.ico:hover{border-color:var(--forest)}
.schtog{display:flex;align-items:center;gap:6px;border:0;background:transparent;padding:0;cursor:pointer;text-align:left;color:inherit;flex:1}
.schtog .car{color:var(--forest);font-size:1rem;width:14px}
.obsrow.coll{border:1px solid var(--line);border-radius:999px;padding:8px 14px;background:#fff;margin:6px 0;gap:6px}.obsrow.coll.open{border-radius:16px;background:#FDFBF6;padding:12px 14px}
.obsrow.coll h4,.obsrow.sch h4{font-size:1rem;margin:0}.schtog h4{flex:1}.rsum{font-size:.75rem;color:#777;white-space:nowrap;font-family:var(--font-body)}.obsrow.coll+.obsrow.coll{border-top:1px solid var(--line)}
.hidlink{font-size:.75rem!important;color:#8a8a8a!important;padding:2px 0!important;background:none!important;border:0!important;text-decoration:underline;min-height:0!important}
.cnt{font-family:var(--font-body);font-size:.75rem;font-weight:700;color:var(--forest);background:var(--forest-tint);border-radius:999px;padding:1px 7px;vertical-align:middle}
.obsrow.sch{gap:4px}
.step .ag{font-size:.72rem;font-weight:600;color:var(--muted)}
.step.ag-now{box-shadow:inset 4px 0 0 #8DBE7E}

let db=null,sample=null,assets=null,downloads=null;
const writing=new Map(); // path -> {busy, dirty}

function setSync(t){$("#sync").textContent=t}
async function persist(kind,id){
  const map=kind==="groups"?S.groups:S.children;const path=kind+"/"+id;
  if(S.mode!=="db"){saveLocal();return}
  let w=writing.get(path);if(!w){w={busy:false,dirty:false};writing.set(path,w)}
  if(w.busy){w.dirty=true;return}
  w.busy=true;setSync("Enregistrement…");
  try{
    do{w.dirty=false;const obj=map.get(id);
      if(obj===undefined){await db.doc(path).delete()}else{await db.doc(path).set(JSON.parse(JSON.stringify(obj)))}
    }while(w.dirty);
    setSync("Enregistré");
  }catch(e){
    if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,800+Math.random()*800));try{const obj=map.get(id);obj===undefined?await db.doc(path).delete():await db.doc(path).set(JSON.parse(JSON.stringify(obj)));setSync("Enregistré")}catch(e2){fail(e2)}}
    else fail(e);
  }finally{w.busy=false}
  function fail(e){setSync("");const m=e&&e.code==="quota_exceeded"?"L'espace de sauvegarde est plein. Supprimez des notes anciennes.":e&&e.code==="invalid_argument"?"Vous n'avez pas le droit de modifier ce carnet.":"La sauvegarde a échoué. Réessayez dans un moment.";toast(m)}
}

function startDb(){
  let gotG=false,gotC=false;
  const timer=setTimeout(()=>{if(!S.ready){S.ready=true;S.loadNote="Les données ne répondent pas encore. Vérifiez votre connexion.";render()}},10000);
  const done=()=>{if(gotG&&gotC){clearTimeout(timer);if(!S.ready){S.ready=true;S.loadNote=null;render()}}};
  const apply=(map,kind)=>snap=>{
    snap.docChanges().forEach(ch=>{const id=ch.doc.id;const w=writing.get(kind+"/"+id);if(w&&w.busy)return;
      if(ch.type==="removed")map.delete(id);else map.set(id,kind==="children"?migrate(JSON.parse(JSON.stringify(ch.doc.data()))):JSON.parse(JSON.stringify(ch.doc.data())))});
    if(kind==="groups"&&!snap.metadata.fromCache)gotG=true;if(kind==="children"&&!snap.metadata.fromCache)gotC=true;
    if(snap.metadata.fromCache&&!S.ready&&snap.size){S.ready=true}
    done();scheduleRender();
  };
  const err=e=>{clearTimeout(timer);S.ready=true;S.loadNote="Impossible de lire les données ("+(e&&e.code||"erreur")+").";render()};
  db.doc("config/custom").onSnapshot(snap=>{if(customWriting)return;CUSTOM=(snap.exists&&snap.data().tpls)||{};applyCustom();scheduleRender()},()=>{});
  db.collection("groups").onSnapshot(apply(S.groups,"groups"),err);
  db.collection("children").onSnapshot(apply(S.children,"children"),err);
}

  return `<svg viewBox="0 0 600 600" class="wsvg" xmlns="http://www.w3.org/2000/svg">${sec(-135,-45,"#F7F4EC")}${sec(-45,45,"#F2C335")}${sec(45,135,"#D63B3F")}${sec(135,225,"#2E2E2E")}

Enfant : ${c.name}${c.dob?", "+ageAt(c.dob):""}
Occupation : ${s.titre}
Observations :
${lines.join("\n")}`;
  if(!sample){const ai=AIS[getAI()];copyText(prompt,"Demande copiée : collez-la dans "+ai.nom+", puis collez sa réponse dans le portrait");ta&&ta.focus();return}

function getAI(){try{return AIS[localStorage.getItem("carnet-ai")]?localStorage.getItem("carnet-ai"):"claude"}catch(e){return "claude"}}
async function copyText(t,msg){try{await navigator.clipboard.writeText(t);toast(msg||"Copié")}catch(e){openSheet(`<h3>Copiez ce texte</h3><p class="muted small" style="margin:0">Sélectionnez tout le texte, puis copiez-le.</p><textarea class="field" readonly style="min-height:240px">${esc(t)}</textarea><button class="btn" id="ctClose">Fermer</button>`,s=>{s.querySelector("#ctClose").onclick=closeSheet;const ta=s.querySelector("textarea");ta.focus();ta.select()})}}
/* ---------- Spécification du bloc carnet (partagée : IA du carnet et projet IA) ---------- */
const norm=t=>String(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");
function lev(a,b){if(a===b)return 0;const m=a.length,n=b.length;let pr=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const cu=[i];for(let j=1;j<=n;j++)cu[j]=Math.min(pr[j]+1,cu[j-1]+1,pr[j-1]+(a[i-1]===b[j-1]?0:1));pr=cu}return pr[n]}
function matchKid(n,map,strict){const x=norm(n);if(!x)return "";if(map.has(x))return map.get(x);
  const first=norm(String(n).trim().split(/\s+/)[0]);if(!strict&&map.has(first))return map.get(first);
  let best="",bd=9,tie=false;for(const [k,id] of map){if(k.length<(strict?5:3)||(strict&&x.length<4))continue;const d=lev(strict?x:first,k);const lim=strict?1:(k.length<=4?1:2);if(d<=lim){if(d<bd){bd=d;best=id;tie=false}else if(d===bd&&id!==best)tie=true}}
  if(best&&!tie)return best;
  if(!strict&&first.length>=3){const pre=[...map].filter(([k])=>k.startsWith(first)||first.startsWith(k));const ids=[...new Set(pre.map(p=>p[1]))];if(ids.length===1)return ids[0]}
  return ""}
function kidNames(c){return [c.name].concat(String(c.alias||"").split(",")).map(x=>x.trim()).filter(Boolean)}
function carnetSpec(g,kids){const T=tpl(g);
  const kl=kids.map(([,c])=>{const al=kidNames(c).slice(1);return `- ${c.name}${al.length?" (aussi écrit : "+al.join(", ")+")":""}`}).join("\n");
  const sl=T.sections.map(x=>`${x.id} = ${(occOf(x.id)||{}).titre||x.titre}${(occOf(x.id)||{subs:[1]}).subs.length>1?" / "+x.titre:""}\n`+x.rows.map(r=>r.free?`  ${x.id}.${r.id} = ${r.label} (note libre)`:`  ${x.id}.${r.id} = ${r.label} : `+r.steps.map((st,i)=>`[${x.id}.${r.id}.${stK(st,i)}] ${stT(st)}`).join(" ; ")).join("\n")).join("\n")+"\nportrait = qui il est (intérêts, ce qui le calme, ce qui est difficile, ce que dit la famille)";
  const ol=(g.objectifs||[]).map(o=>`- ${o.id} = ${o.label}`).join("\n")||"(aucun)";
  const fl=facils().map(([k,t])=>`- ${k} = ${t}`).join("\n");
  return `ENFANTS DU GROUPE (dans le bloc, écris le nom exactement comme le premier nom) :
${kl}

SECTIONS ET REPÈRES (codes) :
${sl}

OBJECTIFS DE GROUPE (codes) :
${ol}

FACILITATEURS (codes) :
${fl}

FORMAT DU BLOC (JSON valide) :
{"date":"AAAA-MM-JJ","presences":["Nom",…],
 "groupe":[{"theme":"climat|environnement|ecole|autre","texte":"…"}],
 "activites":[{"texte":"activité proposée (ex. tyrolienne, dessin sur boîte de carton)","occupation":"jouer|bouger|manip|autonomie|social|communiquer"}],
 "extraits":[{"enfant":"Nom","section":"code de section","repere":"code de ligne (ex. groupe.attente) ou vide","type":"note|explorer|prochain|famille","texte":"…","cases":["codes d'étapes réussies"],"pasencore":["codes d'étapes essayées sans réussir"],"soutien":["presence|verbal|physique"],"facilitateurs":["codes"],"objectif":{"id":"code","resultat":"ok|prog|no"},"motscles":[{"mot":"1 à 3 mots","sphere":"tete|esprit|coeur|corps","type":"force|defi"}]}]}

RÈGLES DU BLOC :
- Tout le texte de la note doit se retrouver dans les extraits ou dans "groupe" : rien ne se perd, rien ne s'invente. Garde les mots de la note.
- Utilise EXACTEMENT les codes listés ci-dessus (ne les modifie pas, ne les invente pas).
- Un extrait par enfant et par sujet. Mets toujours "repere" quand l'extrait porte clairement sur une ligne (ex. attendre son tour → groupe.attente ; rester assis au repas → groupe.assis s'il existe, sinon soin.repas).
- "type" : "explorer" pour une hypothèse, une question ou un élément à surveiller ; "prochain" pour une piste ou un objectif à poursuivre ; "famille" pour ce que disent les parents ; sinon "note".
- Les stratégies de succès restent dans le texte de l'extrait ET leurs codes vont dans "facilitateurs".
- "cases" : les étapes clairement réussies. "pasencore" : les étapes que l'enfant a essayées ou qu'on a observées sans qu'il les réussisse encore. Sinon des listes vides.
- "soutien" : l'aide de l'adulte pour ce repère (presence = l'adulte proche, verbal = rappel, mots proposés, explication, physique = aide avec les mains). Vide s'il l'a fait seul.
- "objectif" seulement si la note dit clairement comment ça s'est passé pour cet enfant à ce moment (arrivée, départ, collation, dîner…) ; "ok" = s'est bien passé, "no" = difficile.
- "activites" : les activités proposées ou vécues pendant la rencontre (une par ligne, courte), avec l'occupation surtout visée. Liste vide si la note n'en parle pas.
- "motscles" : 0 à 3 mots-clés par extrait pour la roue de la médecine, courts (ex. « persévérance », « attente », « équilibre », « empathie »). "force" ou "defi". Sphères : tete = fonctions mentales (attention, compréhension, résolution de problème) ; esprit = affectif et social (liens, appartenance, langue et culture) ; coeur = émotions et régulation ; corps = sensoriel et moteur.
- Pour un moment difficile, garde dans le texte, si la note le dit : ce qui a déclenché (la tâche, l'environnement), ce que l'enfant a fait, et ce qui a aidé.
- "groupe" : "climat" pour la dynamique et l'ambiance, "environnement" pour l'aménagement et le matériel, "ecole" pour ce qui est à arrimer avec la classe ou l'équipe-école.`}
function instrText(gid){const g=S.groups.get(gid);const kids=childrenOf(gid);
  return `Tu m'aides à mettre au propre mes notes d'observation en classe nature. Je suis ergothérapeute et je travaille avec une éducatrice spécialisée, auprès ${tpl(g).objOnly?"de jeunes de 6 à 12 ans, avec 2 ou 3 objectifs ciblés par jeune":"d'enfants de 0 à 5 ans"} (groupe : ${g.name}). Mes notes peuvent être dictées, en vrac, avec des prénoms mal écrits.

Souvent, je te donne d'un coup TOUTES les notes d'une journée, exportées du carnet. Chaque ligne commence par [prénom · endroit] (fiche, terrain, « À classer », objectif de groupe…). Cet endroit est seulement un indice : reclasse chaque note là où elle va vraiment (bon enfant, bonne occupation, bon repère). Une note qui parle de plusieurs enfants va à chacun. Une note sur le groupe en entier va dans les notes du groupe. Aucune note ne doit être perdue : le carnet remplace mes notes brutes par ton bloc.

À CHAQUE NOTE QUE JE TE DONNE :

1. Rédige la note lisible, toujours dans ce format :
Date : …
Présences : …
Observations générales du groupe (par thèmes courts : dynamique, aménagement de l'environnement, à arrimer avec l'école…)
Puis, pour chaque enfant : son prénom, des titres thématiques courts, les faits observés, et au besoin :
« Stratégie de succès : … » · « À explorer : … » (hypothèses, questions) · « Prochain pas : … »
Prénoms : remplace d'emblée chaque prénom mal écrit ou mal transcrit par le bon prénom de la liste ENFANTS DU GROUPE, partout (dans la note ET dans le bloc), sans le signaler. Si tu ne peux vraiment pas savoir de quel enfant il s'agit, garde le mot tel quel et ajoute « (?) ».
Garde mes mots et mes observations. N'invente rien, n'interprète pas au-delà de ce que je dis. Ton professionnel, simple, centré sur les forces, l'occupation et ce qui aide l'enfant (environnement, soutien), plutôt que sur le comportement seul.

2. À la toute fin, ajoute le bloc pour mon carnet, exactement entre ces deux lignes (si la note couvre plusieurs dates, un bloc par date, chacun entre ses deux lignes) :
=== BLOC CARNET ===
(le JSON)
=== FIN BLOC ===

${carnetSpec(g,kids)}`}

function setColl(html,pre){let i=0;return html.replace(/<section class="card"><h3 style="font-size:1\.35rem[^"]*">([^]*?)<\/h3>([^]*?)<\/section>/g,(m,t,body)=>{const k="set-"+pre+"-"+(i++)+"-"+t.replace(/<[^>]+>/g,"").slice(0,20);return `<section class="card setc"><details class="ogdet" data-dk="${esc(k)}" ${openDetails.has(k)?"open":""}><summary><h3 style="font-size:1.25rem;display:inline">${t}</h3></summary><div style="margin-top:8px">${body}</div></details></section>`})}

  o.subs.forEach(sid=>{const sec=T.sections.find(x=>x.id===sid);if(!sec)return;

      <div class="addline"><input class="field" id="cs-${sid}-${r.id}" placeholder="Ajouter un élément à cette ligne"><button class="btn" data-act="addCustStep" data-t="${tk}" data-s="${sid}" data-r="${r.id}">Ajouter</button></div>

  const put=k=>{CUSTOM[k]=CUSTOM[k]||{};CUSTOM[k].rows=CUSTOM[k].rows||{};(CUSTOM[k].rows[sid]=CUSTOM[k].rows[sid]||[]).push(JSON.parse(JSON.stringify(row)))};

  openSheet(`<h3>Raccourcis du mode groupe</h3><p class="muted small" style="margin:0">Les repères qu'on observe souvent chez tout le monde. Ils s'affichent sur la page du groupe et en haut du mode activité.</p>
  <div class="scl">${OCCS.map(o=>`<div class="label" style="margin-top:8px">${esc(shortT(o.titre))}</div>${o.subs.map(sid=>{const sec=T.sections.find(x=>x.id===sid);return sec?sec.rows.filter(r=>!r.free).map(r=>{const k=sid+"."+r.id.replace(/45$/,"");return `<label class="chk"><input type="checkbox" class="scK" value="${k}" ${cur.includes(k)?"checked":""}> ${esc(r.label)}</label>`}).join(""):""}).join("")}`).join("")}</div>
  <div class="row-actions"><button class="btn primary" id="scOk">Enregistrer</button><button class="btn" id="scNo">Annuler</button></div>`,s=>{s.querySelector("#scNo").onclick=closeSheet;s.querySelector("#scOk").onclick=()=>{const v=[...s.querySelectorAll(".scK:checked")].map(x=>x.value);try{localStorage.setItem("carnet-sc",JSON.stringify(v))}catch(e){}closeSheet();render()}})}
function syntheseCore(cid,c){const sy=c.synth||{};const old=Object.entries(SPHERES).map(([k,sp])=>{const v=sy[k]||{};const t=["forces","soutien","fonctionne"].map(f=>v[f]).filter(Boolean).join(" · ");return t?`<div class="small"><b>${sp.nom} :</b> ${esc(t)}</div>`:""}).join("");
  let h=`<section class="card"><h3 style="font-size:1.3rem;margin-bottom:2px">Forces et défis</h3><p class="muted small" style="margin:0">Par sphère de la roue de la médecine. Plus gros = revient souvent. Touchez un mot pour le détail.</p>
  ${roueHTML(cid,c)}
  <div class="addline" style="margin-top:10px;flex-wrap:wrap"><input class="field" id="kwNew" placeholder="Mot-clé (ex. : persévérance)" style="flex:1 1 140px"><select class="field" id="kwSph" style="flex:0 0 auto">${Object.entries(SPHERES).map(([k,v])=>`<option value="${k}">${v.nom}</option>`).join("")}</select><select class="field" id="kwT" style="flex:0 0 auto"><option value="force">Force</option><option value="defi">Défi</option></select><button class="btn primary" data-act="kwAdd" data-id="${cid}">Ajouter</button></div>
  ${old?det("osy-"+cid,"Notes de synthèse écrites avant",old):""}</section>`;
  const L=cqm(c);
  h+=`<section class="card"><h3 style="font-size:1.3rem;margin-bottom:4px">Ce qui marche pour ${esc(c.name)}</h3><p class="muted small" style="margin:0 0 8px">Du plus fréquent au moins fréquent. Touchez pour les exemples.</p>
  ${L.length?`<div class="cqml">${L.map(x=>`<button class="cqmi" data-act="cqmOpen" data-id="${cid}" data-k="${x.k}"><b>${esc(x.t)}</b> <span class="muted small">${x.n} fois</span></button>`).join("")}</div>`:`<p class="muted small">Rien encore.</p>`}
  ${det("fac-"+cid,"Ajouter un facilitateur à la main",`<div class="steps">${facils().map(([k,t])=>{const on=((c.facil||{})[k]||[]).length>0;return `<button class="step${on?" on":""}" data-act="facil" data-id="${cid}" data-k="${k}" aria-pressed="${on}"><span class="t">${esc(t)}</span></button>`}).join("")}</div>`)}</section>`;
  const ex=(c.explore||[]).slice().sort((a,b)=>(a.done?1:0)-(b.done?1:0)||(b.date||"").localeCompare(a.date||""));
  h+=`<section class="card"><h3 style="font-size:1.3rem;margin-bottom:4px">À explorer et à surveiller</h3>
  <div class="addline"><input class="field" id="exNew" placeholder="Hypothèse, question, élément à revoir"><button class="btn primary" data-act="addExplore" data-id="${cid}">Ajouter</button></div>
  <div class="entries" style="margin-top:10px">${ex.map(n=>`<div class="entry${n.done?" done":""}"><span class="when">${fmtD(n.date)}</span><span class="txt">${esc(n.text)}${byTag(n)}</span><button class="btn ghost small" data-act="doneExplore" data-id="${cid}" data-n="${n.id}">${n.done?"Rouvrir":"Réglé"}</button><button class="x" aria-label="Supprimer" data-act="delExplore" data-id="${cid}" data-n="${n.id}">✕</button></div>`).join("")||'<p class="muted small">Rien pour l\'instant.</p>'}</div></section>`;
  return h}
function cqmSheet(cid,k){const c=S.children.get(cid);const x=cqm(c).find(z=>z.k===k);if(!x)return;const ds=[...new Set((c.facil||{})[k]||[])].sort().reverse();
  openSheet(`<h3>${esc(x.t)}</h3><p class="muted small" style="margin:0">${x.n} fois · ${ds.map(d=>fmtD(d)).join(", ")}${x.sph?" · "+esc(SPHERES[x.sph].nom):""}${x.peo?" · "+PEON[x.peo]:""}</p>
  <div class="entries">${x.ex.map(n=>`<div class="entry"><span class="when">${fmtD(n.date)}</span><span class="txt">${esc(n.text)}</span></div>`).join("")||'<p class="muted small">Pas d\'exemple lié à une note.</p>'}</div><button class="btn" id="cqC">Fermer</button>`,s=>{s.querySelector("#cqC").onclick=closeSheet})}
function viewSynthese(cid,c,T){
  const sy=c.synth||{};
  let h=`<section class="card"><div class="sechead"><img src="${img("roue-medecine")}" alt=""><div><h2>Roue de ${esc(c.name)}</h2><div class="sph">Forces et défis par sphère, au fil des rencontres. Plus gros = revient souvent.</div></div></div>
  ${roueHTML(cid,c)}
  <div class="row-actions" style="margin-top:8px"><button class="btn primary small" data-act="rapport" data-id="${cid}">Rapport d'évaluation</button><button class="btn small" data-act="album" data-id="${cid}">Album photos</button><button class="btn small" data-act="exportChild" data-id="${cid}">Fiche d'équipe et exports</button></div>
  <div class="addline" style="margin-top:10px;flex-wrap:wrap"><input class="field" id="kwNew" placeholder="Mot-clé (ex. : persévérance)" style="flex:1 1 140px"><select class="field" id="kwSph" style="flex:0 0 auto">${Object.entries(SPHERES).map(([k,v])=>`<option value="${k}">${v.nom}</option>`).join("")}</select><select class="field" id="kwT" style="flex:0 0 auto"><option value="force">Force</option><option value="defi">Défi</option></select><button class="btn primary" data-act="kwAdd" data-id="${cid}">Ajouter</button></div>
  <p class="muted small" style="margin:6px 0 0">${Object.entries(SPHERES).map(([k,v])=>`<b>${v.nom}</b> : ${esc(v.desc)}`).join(" · ")}</p></section>`;
  {const L=cqm(c);h+=`<section class="card"><h3 style="font-size:1.3rem;margin-bottom:4px">Ce qui marche pour ${esc(c.name)}</h3><p class="muted small" style="margin:0 0 8px">Les facilitateurs qui ont fonctionné, du plus fréquent au moins fréquent, avec des exemples tirés des notes.</p>
  ${L.length?`<div class="entries">${L.map(x=>`<div class="entry col"><div class="erow"><span class="txt"><b>${esc(x.t)}</b> <span class="muted small">· ${x.n} fois · dernière ${fmtD(x.last)}</span>${x.sph?` <span class="kw force s-${x.sph}" style="font-size:.72rem">${esc(SPHERES[x.sph].nom)}</span>`:""}${x.peo?` <span class="tag">${PEON[x.peo]}</span>`:""}</span></div>${x.ex.slice(0,2).map(n=>`<div class="small muted" style="margin-top:3px">${fmtD(n.date)} : ${esc(n.text.length>220?n.text.slice(0,220)+"…":n.text)}</div>`).join("")}</div>`).join("")}</div>`:`<p class="muted small">Rien encore. Les facilitateurs viennent de l'import des notes, ou de la liste plus bas.</p>`}</section>`}
  Object.entries(SPHERES).forEach(([k,sp])=>{const v=sy[k]||{};
    h+=`<section class="card sph-card"><img src="${img(sp.img)}" alt=""><div><h3>${sp.nom} <span class="muted small" style="font-family:var(--font-body);font-weight:400">${sp.desc}</span></h3><div class="sph-fields">
    ${[["forces","Forces observées"],["soutien","Ce qu'on soutient"],["fonctionne","Ce qui fonctionne pour lui"]].map(([f,l])=>`<label>${l}<textarea class="field" data-act="synth" data-id="${cid}" data-k="${k}" data-f="${f}">${esc(v[f]||"")}</textarea></label>`).join("")}
    ${v.maj?`<span class="upd">Mis à jour le ${fmtD(v.maj,true)}</span>`:""}</div></div></section>`});
  const fa=c.facil||{};
  h+=`<section class="card"><h3 style="font-size:1.3rem;margin-bottom:8px">Facilitateurs qui ont fonctionné</h3><div class="steps">${facils().map(([k,t])=>{const a=(fa[k]||[]).slice().sort();const on=a.length>0;
    return `<button class="step${on?" on":""}" data-act="facil" data-id="${cid}" data-k="${k}" aria-pressed="${on}"><span class="t">${esc(t)}</span>${on?`<span class="d">${a.map(d=>fmtD(d)).join(" · ")}</span>`:""}</button>`}).join("")}</div></section>`;
  const ex=(c.explore||[]).slice().sort((a,b)=>(a.done?1:0)-(b.done?1:0)||(b.date||"").localeCompare(a.date||""));
  h+=`<section class="card"><h3 style="font-size:1.3rem;margin-bottom:4px">À explorer et à surveiller</h3><p class="muted small" style="margin:0 0 10px">Hypothèses, questions, éléments à revoir aux prochaines rencontres.</p>
  <div class="addline"><input class="field" id="exNew" placeholder="Ex. : est-ce la langue ou la formulation des demandes qui l'aide ?"><button class="btn primary" data-act="addExplore" data-id="${cid}">Ajouter</button></div>
  <div class="entries" style="margin-top:10px">${ex.map(n=>`<div class="entry${n.done?" done":""}"><span class="when">${fmtD(n.date)}</span><span class="txt">${esc(n.text)}${byTag(n)}</span><button class="btn ghost small" data-act="doneExplore" data-id="${cid}" data-n="${n.id}">${n.done?"Rouvrir":"Réglé"}</button><button class="x" aria-label="Supprimer" data-act="delExplore" data-id="${cid}" data-n="${n.id}">✕</button></div>`).join("")||'<p class="muted small">Rien pour l\'instant.</p>'}</div></section>`;
  const all=(c.notes||[]).slice().sort((a,b)=>(b.date||"").localeCompare(a.date||"")).slice(0,30);
  h+=`<section class="card"><h3 style="font-size:1.3rem;margin-bottom:8px">Toutes les notes récentes</h3><div class="entries">${all.map(n=>`<div class="entry"><span class="when">${fmtD(n.date)}</span><span class="txt"><b>${esc(secTitle(T,n.section))}</b> · ${esc(n.text)}</span></div>`).join("")||'<p class="muted small">Aucune note.</p>'}</div></section>`;
  return h;
}

/* ---------- Actions ---------- */
function mutChild(cid,fn){const c=S.children.get(cid);if(!c)return;const copy=JSON.parse(JSON.stringify(c));fn(copy);S.children.set(cid,copy);persist("children",cid);render()}
function mutGroup(gid,fn){const g=S.groups.get(gid);if(!g)return;const copy=JSON.parse(JSON.stringify(g));fn(copy);S.groups.set(gid,copy);persist("groups",gid);render()}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b||b.tagName==="TEXTAREA"||b.tagName==="INPUT")return;
  const a=b.dataset.act,id=b.dataset.id,k=b.dataset.k;
  if((a==="step"||a==="objMark"||a==="cLv"||a==="cRep")&&lpFired){lpFired=false;return}
  if(a==="step"&&S.hideMode&&S.hideMode===id&&b.classList.contains("step")){mutChild(id,x=>{const l=x.hideSteps||[];x.hideSteps=l.includes(k)?l.filter(v=>v!==k):l.concat(k)});return}
  if(a==="hideMode"){S.hideMode=S.hideMode===id?null:id;render();return}
  if(a==="jumpRow"){const el=document.getElementById(k);if(el){const y=el.getBoundingClientRect().top+scrollY-64;scrollTo({top:y,behavior:"smooth"})}return}
  if(a==="cLv"){if(S.hideMode&&S.hideMode===id){mutChild(id,x=>{const l=x.hideSteps||[];x.hideSteps=l.includes(k)?l.filter(v=>v!==k):l.concat(k)});return}
    const d=S.obsDate;const c0=S.children.get(id);const now=lvlOnC(c0,k,d),last=lvlOfC(c0,k);const nx=now?(now===3?0:now+1):(last?Math.min(last+1,3):1);mutChild(id,x=>setLvlC(x,k,nx,d));return}
  if(a==="cRep"){if(S.hideMode&&S.hideMode===id){mutChild(id,x=>{const l=x.hideSteps||[];x.hideSteps=l.includes(k)?l.filter(v=>v!==k):l.concat(k)});return}
    const d=S.obsDate;mutChild(id,x=>{x.checks=x.checks||{};const A=x.checks[k]||[];if(A.includes(d)){x.checks[k]=A.filter(v=>v!==d);if(!x.checks[k].length)delete x.checks[k]}else x.checks[k]=A.concat(d).sort()});return}
  if(a==="cStep"){stepSheet(id,k,b.dataset.l||"");return}
  if(a==="cInt"){const v=+b.dataset.v;mutChild(id,x=>{x.fint=x.fint||{};const f=x.fint[k]=x.fint[k]||{};if(f.int===v)delete f.int;else{f.int=v;f.intD=S.obsDate}});return}
  if(a==="cArr"){const z=b.dataset.z,v=b.dataset.v;mutChild(id,x=>{x.fint=x.fint||{};const f=x.fint[k]=x.fint[k]||{};const A=f[z]=f[z]||[];const i=A.indexOf(v);i>=0?A.splice(i,1):A.push(v)});return}
  if(a==="stepHist"){e.stopPropagation();const st=b.closest('[data-act="step"]');stepSheet(id,k,st?st.querySelector(".t").textContent:"");return}
  if(a==="step"){const d=S.obsDate;mutChild(id,x=>{x.checks=x.checks||{};x.notyet=x.notyet||{};const ok=(x.checks[k]||[]).includes(d),ny=(x.notyet[k]||[]).includes(d);
      if(!ok&&!ny){x.checks[k]=(x.checks[k]||[]).concat(d)}else if(ok){x.checks[k]=x.checks[k].filter(v=>v!==d);x.notyet[k]=(x.notyet[k]||[]).concat(d)}else{x.notyet[k]=x.notyet[k].filter(v=>v!==d)}})}
  else if(a==="facil"){const field="facil";const c=S.children.get(id);const cur=((c[field]||{})[k]||[]);
    if(!cur.length){mutChild(id,x=>{x[field]=x[field]||{};x[field][k]=[S.obsDate]})}
    else dateSheet(id,field,k,b.querySelector(".t").textContent);
  }
  else if(a==="sout"){const t=b.dataset.t;mutChild(id,x=>{x.sout=x.sout||{};const arr=x.sout[k]||[];const i=arr.findIndex(e=>e.d===S.obsDate&&e.t===t);if(i>=0)arr.splice(i,1);else arr.push({t,d:S.obsDate});x.sout[k]=arr})}
  else if(a==="delSout"){e.stopPropagation();mutChild(id,x=>{x.sout[k]=(x.sout[k]||[]).filter(v=>v.d!==b.dataset.d)})}
  else if(a==="addFree"){const inp=document.getElementById("free-"+id+"-"+k.replace(".","-"));const t=inp.value.trim();if(!t){inp.focus();return}inp.value="";mutChild(id,x=>{x.free=x.free||{};(x.free[k]=x.free[k]||[]).push({id:uid("f"),date:S.obsDate,text:t,by:getMe()})})}
  else if(a==="delFree"){mutChild(id,x=>{x.free[k]=(x.free[k]||[]).filter(n=>n.id!==b.dataset.n)})}
  else if(a==="cObjMark"){const oid=b.dataset.o;const tri=isObjOnly(S.children.get(id));mutChild(id,x=>{const o=(x.objectifs||[]).find(v=>v.id===oid);if(!o)return;o.marks=o.marks||{};const v=o.marks[S.obsDate]||"";const seq=["","no","prog","ok"];const nv=seq[(seq.indexOf(v)+1)%seq.length];if(nv)o.marks[S.obsDate]=nv;else delete o.marks[S.obsDate]})}
  else if(a==="cObjDone"){mutChild(id,x=>{const o=(x.objectifs||[]).find(v=>v.id===b.dataset.o);if(o)o.done=!o.done})}
  else if(a==="cObjDel"){confirmSheet("Retirer cet objectif et son suivi ?",()=>mutChild(id,x=>{x.objectifs=(x.objectifs||[]).filter(v=>v.id!==b.dataset.o)}))}
  else if(a==="cObjAdd"){const l=$("#coLabel").value.trim();if(!l){$("#coLabel").focus();return}const cc=S.children.get(id);if(childObjs(cc).filter(o=>!o.done).length>=3&&!b.dataset.force){confirmSheetCustom(`${cc.name} a déjà 3 objectifs actifs. On vise 2 ou 3 au maximum. Ajouter quand même ?`,"Ajouter quand même",()=>{b.dataset.force="1";b.click();delete b.dataset.force});return}$("#coLabel").value="";const lk=$("#coLink").value;mutChild(id,x=>{(x.objectifs=x.objectifs||[]).push({id:uid("o"),label:l,k:lk.includes(".")?lk:"",occ:lk.includes(".")?lk.split(".")[0]:lk,date:S.obsDate,marks:{}})});toast("Objectif ajouté")}
  else if(a==="cObjSugg"){mutChild(id,x=>{(x.objectifs=x.objectifs||[]).push({id:uid("o"),label:b.dataset.l,k:k.includes(".")?k:"",occ:k.split(".")[0],date:S.obsDate,marks:{}})});toast("Objectif ajouté")}
  else if(a==="presMark"){const cid=b.dataset.c;mutGroup(id,g=>{g.presences=g.presences||{};const l=g.presences[S.obsDate]||[];g.presences[S.obsDate]=l.includes(cid)?l.filter(x=>x!==cid):l.concat(cid)})}
  else if(a==="addExplore"){const inp=$("#exNew");const t=inp.value.trim();if(!t){inp.focus();return}inp.value="";mutChild(id,x=>{(x.explore=x.explore||[]).push({id:uid("x"),date:S.obsDate,text:t,by:getMe()})})}
  else if(a==="doneExplore"){mutChild(id,x=>{const n=(x.explore||[]).find(v=>v.id===b.dataset.n);if(n)n.done=!n.done})}
  else if(a==="delExplore"){mutChild(id,x=>{x.explore=(x.explore||[]).filter(v=>v.id!==b.dataset.n)})}
  else if(a==="saveMe"){const v=($("#meName")||{}).value||"";setMe(v.trim());toast(v.trim()?"Vos notes seront signées « "+v.trim()+" »":"Signature retirée");render()}
  else if(a==="setAI"){try{localStorage.setItem("carnet-ai",k)}catch(e){}render()}
  else if(a==="copyInstr"){const t=instrText(b.dataset.id);copyText(t,"Instructions copiées")}
  else if(a==="addFacil"){const inp=$("#facNew");const t=inp.value.trim();if(!t){inp.focus();return}inp.value="";CUSTOM._facil=(CUSTOM._facil||[]).concat({id:"f"+Math.random().toString(36).slice(2,8),t});saveCustom();toast("Facilitateur ajouté")}
  else if(a==="delFacil"){confirmSheet("Retirer ce facilitateur ? Ce qui a déjà été coché reste enregistré.",()=>{CUSTOM._facil=(CUSTOM._facil||[]).filter(x=>x.id!==b.dataset.x);saveCustom()})}
  else if(a==="recap")recapSheet(id);
  else if(a==="dayNotes"||a==="expDay")exportDaySheet(id);
  else if(a==="actRow"){S.rowFilter=Object.assign({},S.rowFilter,{row:k});render()}
  else if(a==="tKid")terrainKid(id,b.dataset.c);
  else if(a==="tBilan")terrainBilan(id);
  else if(a==="tRanger")terrainRanger(id);
  else if(a==="tOnlyOff"){S.tOnly=false;render()}
  else if(a==="selN"){S.selN=S.selN===k?null:k;render()}
  else if(a==="delSelN"){const box=document.querySelector(`[data-nsec="${k}"]`);const ids=[...box.querySelectorAll(".nsel:checked")].map(x=>x.value);if(!ids.length){toast("Cochez au moins une note.");return}
    confirmSheet(`Supprimer ${ids.length} note${ids.length>1?"s":""} ?`,()=>{mutChild(id,x=>{x.notes=(x.notes||[]).filter(n=>!ids.includes(n.id))});S.selN=null;toast(ids.length+" note"+(ids.length>1?"s":"")+" supprimée"+(ids.length>1?"s":""))})}
  else if(a==="regNew")regSheet(id,null,b.dataset.d);
  else if(a==="regEdit")regSheet(id,k);
  else if(a==="regExport")regExport(id);
  else if(a==="regPrint")regPrint(id);
  else if(a==="rapport")rapportSheet(id);
  else if(a==="album")albumSheet(id);
  else if(a==="exportChild")exportSheet(id);
  else if(a==="cqmGroup")cqmGroupSheet(id);
  else if(a==="piAdd"){const t=($("#piNew")||{}).value;if(!t||!t.trim())return;mutChild(id,x=>{(x.pistes=x.pistes||[]).push({id:uid("p"),text:t.trim(),date:S.obsDate,src:"manuel",by:getMe()})})}
  else if(a==="piDel"){const n=b.dataset.n;mutChild(id,x=>{x.pistes=(x.pistes||[]).filter(p=>p.id!==n)})}
  else if(a==="piDone"){const n=b.dataset.n;mutChild(id,x=>{const p=(x.pistes||[]).find(p=>p.id===n);if(p)p.done=!p.done})}
  else if(a==="piObj"){const n=b.dataset.n;const c=S.children.get(id);const pi=(c.pistes||[]).find(p=>p.id===n);if(!pi)return;

  const addO=(o,lab,titre)=>{lab=lab.trim().replace(/\s+/g," ");const key=lab.toLowerCase();if(seen.has(key)){const e=seen.get(key);if(!o._used)e.marks=Object.assign({},o.marks||{},e.marks||{});o._used=(o._used||0)+1;return}const k2=o._used||0;const n=Object.assign({},o,{label:lab,marks:k2?{}:Object.assign({},o.marks||{})});n.id=k2?o.id+"s"+k2:o.id;o._used=k2+1;if(titre)n.titre=titre;delete n._used;seen.set(key,n);out.push(n)};
  const sent=t=>t.split(/(?<=[.!?])\s+(?=[A-ZÀ-ÖÉÈÊ«])/).map(x=>x.trim()).filter(x=>x.length>3);
  L.forEach(o=>{const lab=String(o.label||"").trim();const m=lab.match(OBJHEAD);
    if(o.titre||(!m&&lab.length<=110)){addO(o,lab,o.titre);return}
    const head=m?m[1].toLowerCase():"";const body=m?lab.slice(m[0].length):lab;
    if(/intervention|recommandation|stratégie|moyen/.test(head)){sent(body).forEach(t=>addP(t,o));return}
    const S2=sent(body);const withT=S2.filter(t=>/^[^:]{3,60}\s*:\s*\S/.test(t));
    if(withT.length){S2.forEach(t=>{const mm=t.match(/^([^:]{3,60})\s*:\s*(.+)$/);if(mm&&!/^(observer|vérifier|porter attention|noter)\b/i.test(mm[1]))addO(o,t,mm[1].trim());else addP(t,o)})}
    else S2.forEach(t=>{let tt=t.replace(/[.!?]+$/,"");const m2=tt.match(/^(.{12,}?)\s+(lors d[eu]|à l['’]aide|afin|pour|par|dans|autrement|avec|en)\s/i);if(m2&&m2[1].split(/\s+/).length>=3)tt=m2[1];const w=tt.split(/\s+/);addO(o,t,w.length>8?w.slice(0,7).join(" ")+"…":tt)})});

async function shrink(file){

function parseBloc(raw){if(!raw)return null;let t=raw;const m=raw.match(/===\s*BLOC CARNET\s*===([\s\S]*?)(===\s*FIN BLOC\s*===|$)/i);if(m)t=m[1];
  t=t.replace(/```(json)?/g,"");const a=t.indexOf("{"),b=t.lastIndexOf("}");if(a<0||b<a)return null;try{const o=JSON.parse(t.slice(a,b+1));return Array.isArray(o.extraits)?o:null}catch(e){return null}}
function stripBloc(raw){return String(raw||"").replace(/===\s*BLOC CARNET\s*===[\s\S]*?(===\s*FIN BLOC\s*===|$)/gi,"").trim()}
function parseBlocs(raw){if(!raw)return null;const out=[];const re=/===\s*BLOC CARNET\s*===([\s\S]*?)(===\s*FIN BLOC\s*===|$)/gi;let m;
  while((m=re.exec(raw))){const b=parseBloc("=== BLOC CARNET ==="+m[1]+"=== FIN BLOC ===");if(b)out.push(b);if(!m[0].length)break}
  if(out.length)return out;
  const t=String(raw).replace(/```(json)?/g,"");const a=t.indexOf("{"),z=t.lastIndexOf("}");if(a>=0&&z>a){try{const o=JSON.parse(t.slice(a,z+1));if(Array.isArray(o.rencontres))return o.rencontres.filter(x=>x&&Array.isArray(x.extraits));if(Array.isArray(o.extraits))return [o]}catch(e){}}
  return null}

${carnetSpec(g,kids)}

"""
${text}

      x.sout=x.sout||{};b.eng.forEach(({row,ts})=>{const a=x.sout[row]||[];ts.forEach(t=>{if(!a.some(e=>e.d===date&&e.t===t)){a.push({t,d:date});im.sout.push(row+"|"+t)}});x.sout[row]=a});
      x.facil=x.facil||{};b.facs.forEach(k=>{const a=x.facil[k]||[];if(!a.includes(date)){a.push(date);im.facs.push(k)}x.facil[k]=a});
      repairKeys(x);im.checks=im.checks.map(k=>fixKey(x,k)||k);im.ny=im.ny.map(k=>fixKey(x,k)||k);im.sout=im.sout.map(v=>{const [r,t]=v.split("|");return (fixKey(x,r)||r)+"|"+t});

    S.groups.set(gid,gg);persist("groups",gid);

function dayItems(gid,date){const g=S.groups.get(gid);const out=[];
  (g.journal||[]).filter(n=>n.date===date&&n.theme!=="source"&&n.theme!=="jour").forEach(n=>out.push({kind:"j",gid,id:n.id,who:"Groupe",where:JTHEMES[n.theme]||"Journal",text:n.text}));
  childrenOf(gid).forEach(([cid,c])=>{
    (c.notes||[]).filter(n=>n.date===date).forEach(n=>{const o=n.obj&&(g.objectifs||[]).find(x=>x.id===n.obj);out.push({kind:"n",cid,id:n.id,who:c.name,where:n.src==="terrain"?"Terrain":(occOf(n.section)||{}).titre?(n.k?stepLabel(c,n.k):secTitle(TEMPLATES[baseTpl(c)],n.section))+(o?" · objectif "+o.label:""):secTitle(TEMPLATES[baseTpl(c)],n.section),text:n.text})});
    Object.entries(c.free||{}).forEach(([k,l])=>l.filter(n=>n.date===date).forEach(n=>{const lab=[...PORTRAIT_ROWS].find(r=>"portrait."+r.id===k);out.push({kind:"f",cid,k,id:n.id,who:c.name,where:lab?lab.label:stepLabel(c,k)||k,text:n.text})}));
    (c.explore||[]).filter(n=>n.date===date).forEach(n=>out.push({kind:"x",cid,id:n.id,who:c.name,where:"À explorer",text:n.text}));
  });
  return out.map((it,i)=>Object.assign(it,{tag:"N"+(i+1)}))}
function dayFacts(gid,date){const g=S.groups.get(gid);const lines=[];const pr=(presOf(g,date)||[]).map(id=>(S.children.get(id)||{}).name).filter(Boolean);
  if(pr.length)lines.push("Présences : "+pr.join(", "));if(ctxOf(gid,date))lines.push("Contexte : "+ctxOf(gid,date));
  childrenOf(gid).forEach(([cid,c])=>{const f=[];const T=TEMPLATES[baseTpl(c)];
    T.sections.forEach(sec=>{const cs=childSec(c,sec.id);(cs.rows||[]).forEach(r=>{(r.steps||[]).forEach((st,i)=>{if(((c.checks||{})[sec.id+"."+r.id+"."+stK(st,i)]||[]).includes(date))f.push(`${r.label} : ${stT(st)}`);if(((c.notyet||{})[sec.id+"."+r.id+"."+stK(st,i)]||[]).includes(date))f.push(`${r.label} : pas encore « ${stT(st)} »`)});const so=((c.sout||{})[sec.id+"."+r.id]||[]).filter(e=>e.d===date).map(e=>SOUT[e.t]?SOUT[e.t].nom.toLowerCase():e.t);if(so.length)f.push(`${r.label} : soutien ${so.join(", ")}`)})});
    Object.entries(c.facil||{}).forEach(([k,a])=>{if(a.includes(date))f.push("Stratégie qui a aidé : "+((facils().find(x=>x[0]===k)||[k,k])[1]))});
    (g.objectifs||[]).forEach(o=>{const v=(((g.objRes||{})[date]||{})[o.id]||{})[cid];if(v)f.push(`Objectif ${o.label} : ${ONAME[v]||v}`)});
    (c.objectifs||[]).forEach(o=>{const v=(o.marks||{})[date];if(v)f.push(`Objectif individuel « ${o.label} » : ${ONAME[v]||v}`)});
    if(f.length)lines.push(`${c.name} (cases cochées) : ${f.join(" ; ")}`)});
  return lines.join("\n")}

      try{const from=s.querySelector("#rcFrom").value||"0000",to=s.querySelector("#rcTo").value||"9999";const html=await buildRecap(gid,from,to,!!(s.querySelector("#rcAI")&&s.querySelector("#rcAI").checked));
        const fn=`recapitulatif-${(g.name||"groupe").replace(/[^\p{L}\p{N}]+/gu,"-").toLowerCase()}-${todayISO()}.html`;
        if(downloads){try{await downloads.save({filename:fn,data:new Blob([html],{type:"text/html"})});closeSheet();toast("Fichier créé")}catch(e){b.disabled=false;b.textContent="Créer le fichier";if(e&&e.code!=="declined")toast("Le fichier n'a pas pu être créé.")}}
        else{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([html],{type:"text/html"}));a.download=fn;document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),500);closeSheet()}
      }catch(e){b.disabled=false;b.textContent="Créer le fichier";toast("Le récapitulatif a échoué.")}};
  })}
async function buildRecap(gid,from,to,useAI){
  const g=S.groups.get(gid);const kids=childrenOf(gid);const E=esc;const inR=d=>d>=from&&d<=to;
  const pd=presDates(g).filter(inR);
  const data=kids.map(([cid,c])=>{const T=TEMPLATES[baseTpl(c)];const cells={};const notesBy={};
    RECAP_COLS.forEach(([key,,secs])=>{const items=[];secs.forEach(sid=>{const sec=childSec(c,sid);if(!sec)return;sec.rows.forEach(r=>{if(!r.steps)return;const on=r.steps.map((st,i)=>({t:stT(st),a:((c.checks||{})[sid+"."+r.id+"."+stK(st,i)]||[]).filter(inR)})).filter(x=>x.a.length);if(!on.length)return;items.push(r.rep?on.map(x=>x.t).join(", "):on[on.length-1].t)})});
      cells[key]=items.join(" ; ");notesBy[key]=(c.notes||[]).filter(n=>secs.includes(n.section)&&inR(n.date)).map(n=>`(${n.date}) ${n.text}`)});
    const defis=(c.explore||[]).filter(x=>!x.done).map(x=>x.text);
    const objNo={};Object.entries(g.objRes||{}).filter(([d])=>inR(d)).forEach(([,day])=>Object.entries(day).forEach(([oid,r])=>{if(r[cid]==="no"){const o=(g.objectifs||[]).find(x=>x.id===oid);if(o)objNo[o.label]=(objNo[o.label]||0)+1}}));
    cells.defis=defis.concat(Object.entries(objNo).map(([l,n])=>l+(n>1?` (${n} fois)`:""))).join(" ; ");
    const fc=Object.entries(c.facil||{}).map(([k,a])=>[k,a.filter(inR).length]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]);
    cells.strategies=fc.map(([k,n])=>((facils().find(f=>f[0]===k)||[k,k])[1])+(n>1?` (${n})`:"")).join(" ; ");
    const myP=pd.filter(d=>g.presences[d].includes(cid));
    return{cid,c,cells,notesBy,pres:pd.length?`${myP.length}/${pd.length} : ${myP.map(d=>fmtD(d)).join(", ")}`:""}});
  if(useAI&&sample){try{
    const prompt=`Tu aides une ergothérapeute à remplir le récapitulatif de son groupe de classe nature. Pour chaque enfant, écris des cases courtes (une à trois phrases brèves séparées par des points-virgules), à partir de SES notes seulement, sans rien inventer, centrées sur les forces et ce qui aide. Colonnes : social (habiletés sociales), jeu, langage, motricite, autonomie, regulation (régulation émotionnelle), defis, strategies (stratégies efficaces). Laisse une case vide s'il n'y a rien.
Réponds seulement en JSON : {"Nom":{"social":"…","jeu":"…","langage":"…","motricite":"…","autonomie":"…","regulation":"…","defis":"…","strategies":"…"}}

${data.map(d=>`ENFANT : ${d.c.name}
${RECAP_COLS.map(([k,l])=>`[${k}] repères : ${d.cells[k]||"—"} | notes : ${(d.notesBy[k]||[]).join(" / ")||"—"}`).join("\n")}
[defis] ${d.cells.defis||"—"}
[strategies] ${d.cells.strategies||"—"}`).join("\n\n")}`;
    const res=await sample.json(prompt,{modelTier:"default"});
    if(res&&typeof res==="object")data.forEach(d=>{const r=res[d.c.name];if(r)Object.keys(r).forEach(k=>{if(r[k])d.cells[k]=String(r[k])})});
  }catch(e){}}
  const cols=RECAP_COLS.map(x=>[x[0],x[1]]).concat([["defis","Défis"],["strategies","Stratégies efficaces"]]);
  return `<!DOCTYPE html><html lang="fr-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Récapitulatif : ${E(g.name)}</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@600&display=swap" rel="stylesheet">
<style>body{margin:0;font-family:Barlow,system-ui,sans-serif;color:#2E3830;background:#F7F3EA}main{padding:24px}h1{font-family:"Barlow Condensed",sans-serif;font-weight:600;margin:0 0 4px}p{margin:0 0 14px;color:#6B7369}
.wrap{overflow-x:auto}table{border-collapse:collapse;background:#FFFDF8;font-size:.86rem;min-width:1100px}th,td{border:1px solid #E4DCCB;padding:8px;vertical-align:top;text-align:left}thead th{background:#3D6A4A;color:#fff;font-weight:600}tbody th{background:#EEF4EA;white-space:nowrap}tbody th small{display:block;font-weight:400;color:#6B7369;white-space:normal}
@media print{@page{size:landscape}body{background:#fff}main{padding:0}table{min-width:0;font-size:.75rem}}</style></head><body><main>
<h1>Récapitulatif des observations · ${E(g.name)}</h1><p>${from>"0000"?"Du "+fmtD(from,true)+" ":""}${to<"9999"?"au "+fmtD(to,true):""} · classe nature</p>
<div class="wrap"><table><thead><tr><th>Enfant (présences)</th>${cols.map(([,l])=>`<th>${l}</th>`).join("")}</tr></thead><tbody>
${data.map(d=>`<tr><th>${E(d.c.name)}${d.pres?`<small>(${E(d.pres)})</small>`:""}</th>${cols.map(([k])=>`<td>${E(d.cells[k]||"")}</td>`).join("")}</tr>`).join("")}
</tbody></table></div></main></body></html>`;
}

/* ---------- Mode appareil (version GitHub) : stockage local, sauvegarde, fusion ---------- */
const LOCAL={idb:null,cache:new Map(),meta:{tomb:[],backupAt:null},colL:{},docL:{},
  open(){return new Promise((res,rej)=>{const r=indexedDB.open("carnet-nature-local",1);r.onupgradeneeded=()=>{const d=r.result;["docs","photos","meta"].forEach(n=>d.createObjectStore(n))};r.onsuccess=()=>{LOCAL.idb=r.result;res()};r.onerror=()=>rej(r.error)})},
  req(store,mode,fn){return new Promise((res,rej)=>{const t=LOCAL.idb.transaction(store,mode);const q=fn(t.objectStore(store));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
  all(store){return new Promise((res,rej)=>{const st=LOCAL.idb.transaction(store).objectStore(store);const ks=st.getAllKeys(),vs=st.getAll();ks.onsuccess=()=>{vs.onsuccess=()=>res(ks.result.map((k,i)=>[k,vs.result[i]]))};ks.onerror=vs.onerror=()=>rej(ks.error)})},
  getPhoto(id){return new Promise((res,rej)=>{if(!LOCAL.idb)return res(null);const q=LOCAL.idb.transaction("photos").objectStore("photos").get(id);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
  saveMeta(){return LOCAL.req("meta","readwrite",st=>st.put(LOCAL.meta,"meta"))},
  ids(o,acc){acc=acc||new Set();if(Array.isArray(o))o.forEach(x=>{if(x&&typeof x==="object"){if(x.id)acc.add(x.id);LOCAL.ids(x,acc)}});else if(o&&typeof o==="object")Object.values(o).forEach(v=>LOCAL.ids(v,acc));return acc},
  snap(path){const d=LOCAL.cache.get(path);return{id:path.split("/").pop(),exists:d!==undefined,data:()=>d===undefined?undefined:JSON.parse(JSON.stringify(d)),metadata:{fromCache:false,hasPendingWrites:false}}},
  notify(path,type){const col=path.split("/")[0];const ch={type,doc:LOCAL.snap(path)};(LOCAL.colL[col]||[]).forEach(cb=>cb({docChanges:()=>[ch],docs:[],size:1,empty:false,metadata:{fromCache:false}}));(LOCAL.docL[path]||[]).forEach(cb=>cb(LOCAL.snap(path)))},
  async init(){await LOCAL.open();(await LOCAL.all("docs")).forEach(([k,v])=>LOCAL.cache.set(k,v));const m=await LOCAL.req("meta","readonly",st=>st.get("meta"));if(m)LOCAL.meta=Object.assign({tomb:[],backupAt:null},m);
    try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
    const docRef=path=>({
      async set(data){const prev=LOCAL.cache.get(path);const clean=JSON.parse(JSON.stringify(data));
        if(prev){const now=LOCAL.ids(clean);const gone=[...LOCAL.ids(prev)].filter(x=>!now.has(x));if(gone.length){LOCAL.meta.tomb=[...new Set(LOCAL.meta.tomb.concat(gone))];await LOCAL.saveMeta()}}
        LOCAL.cache.set(path,clean);await LOCAL.req("docs","readwrite",st=>st.put(clean,path));LOCAL.notify(path,prev?"modified":"added")},
      async delete(){const prev=LOCAL.cache.get(path);if(prev===undefined)return;LOCAL.cache.delete(path);await LOCAL.req("docs","readwrite",st=>st.delete(path));LOCAL.meta.tomb=[...new Set(LOCAL.meta.tomb.concat(path.split("/").pop(),[...LOCAL.ids(prev)]))];await LOCAL.saveMeta();LOCAL.notify(path,"removed")},
      onSnapshot(cb){(LOCAL.docL[path]=LOCAL.docL[path]||[]).push(cb);setTimeout(()=>cb(LOCAL.snap(path)),0);return()=>{LOCAL.docL[path]=LOCAL.docL[path].filter(x=>x!==cb)}},
      get:async()=>LOCAL.snap(path)});
    const db={doc:docRef,collection:name=>({onSnapshot(cb){(LOCAL.colL[name]=LOCAL.colL[name]||[]).push(cb);setTimeout(()=>{const docs=[...LOCAL.cache.keys()].filter(k=>k.split("/")[0]===name).map(k=>LOCAL.snap(k));cb({docChanges:()=>docs.map(d=>({type:"added",doc:d})),docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false}})},0);return()=>{LOCAL.colL[name]=LOCAL.colL[name].filter(x=>x!==cb)}},doc:id=>docRef(name+"/"+id)})};
    const assets={async upload(blob){const id="p"+Math.random().toString(36).slice(2,10)+Date.now().toString(36);await LOCAL.req("photos","readwrite",st=>st.put(blob,id));const u=URL.createObjectURL(blob);photoURLs.set(id,u);return{id,url:u,sizeBytes:blob.size,contentType:blob.type}},
      async delete(id){await LOCAL.req("photos","readwrite",st=>st.delete(id));return{deleted:true}}};
    const downloads={async save({filename,data}){const a=document.createElement("a");a.href=URL.createObjectURL(data instanceof Blob?data:new Blob([data]));a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);return{status:"saved"}}};
    return{db,assets,downloads}},
  async pack(withPhotos){const docs={};LOCAL.cache.forEach((v,k)=>docs[k]=v);const out={app:"carnet-nature",format:2,exportedAt:new Date().toISOString(),by:getMe(),docs,tomb:LOCAL.meta.tomb,photos:{}};
    if(withPhotos){const ids=new Set();S.children.forEach(c=>(c.photos||[]).forEach(p=>ids.add(p.id)));for(const id of ids){const b=await LOCAL.getPhoto(id);if(b)out.photos[id]=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)})}}return out},
  async backup(withPhotos){toast("Préparation de la sauvegarde…");const out=await LOCAL.pack(withPhotos);const who=(getMe()||"").replace(/[^\p{L}\p{N}]+/gu,"-").toLowerCase();
    await downloads.save({filename:`carnet-nature-${todayISO()}${who?"-"+who:""}${withPhotos?"":"-sans-photos"}.json`,data:new Blob([JSON.stringify(out)],{type:"application/json"})});LOCAL.meta.backupAt=todayISO();await LOCAL.saveMeta();render()},
  async backupPhotos(){const done=new Set(LOCAL.meta.photoIds||[]);const ids=[];S.children.forEach(c=>(c.photos||[]).forEach(p=>{if(!done.has(p.id))ids.push(p.id)}));
    if(!ids.length){toast("Aucune nouvelle photo depuis la dernière sauvegarde.");return}
    toast("Préparation de "+ids.length+" photo"+(ids.length>1?"s":"")+"…");const out={app:"carnet-nature",format:2,photosOnly:true,exportedAt:new Date().toISOString(),by:getMe(),docs:{},tomb:[],photos:{}};
    for(const id of ids){const b=await LOCAL.getPhoto(id);if(b)out.photos[id]=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)})}
    const who=(getMe()||"").replace(/[^\p{L}\p{N}]+/gu,"-").toLowerCase();
    await downloads.save({filename:`carnet-nature-photos-${todayISO()}${who?"-"+who:""}.json`,data:new Blob([JSON.stringify(out)],{type:"application/json"})});
    LOCAL.meta.photoIds=[...done,...Object.keys(out.photos)];LOCAL.meta.photoAt=todayISO();await LOCAL.saveMeta();render()},
  async importPhotos(d){let n=0;for(const [id,du] of Object.entries(d.photos||{})){if(await LOCAL.getPhoto(id))continue;try{const b=await (await fetch(du)).blob();await LOCAL.req("photos","readwrite",s=>s.put(b,id));n++}catch(e){}}
    toast(n?n+" photo"+(n>1?"s":"")+" ajoutée"+(n>1?"s":""):"Ces photos étaient déjà là.");setTimeout(()=>location.reload(),900)},
  async readFile(f){try{const d=JSON.parse(await f.text());if(d.app!=="carnet-nature"||!d.docs)throw 0;return d}catch(e){toast("Ce fichier n'est pas une sauvegarde du carnet.");return null}},
  async writeAll(docs,photos){const tx=LOCAL.idb.transaction("docs","readwrite");const st=tx.objectStore("docs");st.clear();Object.entries(docs).forEach(([k,v])=>st.put(v,k));await new Promise((r,j)=>{tx.oncomplete=r;tx.onerror=()=>j(tx.error)});
    for(const [id,du] of Object.entries(photos||{})){if(await LOCAL.getPhoto(id))continue;try{const b=await (await fetch(du)).blob();await LOCAL.req("photos","readwrite",s=>s.put(b,id))}catch(e){}}
    await LOCAL.saveMeta();location.hash="#accueil";location.reload()},
  async restore(f){const d=await LOCAL.readFile(f);if(!d)return;if(d.photosOnly){LOCAL.importPhotos(d);return}const ng=Object.keys(d.docs).filter(k=>k.startsWith("groups/")).length,nc=Object.keys(d.docs).filter(k=>k.startsWith("children/")).length;
    confirmSheetCustom(`Remplacer tout le carnet de cet appareil par cette sauvegarde (${ng} groupe(s), ${nc} fiche(s)) ? Pour combiner avec ce qui est déjà ici, utilisez plutôt « Fusionner ».`,"Remplacer tout",async()=>{LOCAL.meta.tomb=d.tomb||[];await LOCAL.writeAll(d.docs,d.photos)})},
  mergeVal(a,b,path,conf){if(JSON.stringify(a)===JSON.stringify(b))return a;if(a===undefined)return b;if(b===undefined)return a;
    if(Array.isArray(a)&&Array.isArray(b)){const objs=[...a,...b].every(x=>x&&typeof x==="object");
      if(objs&&[...a,...b].every(x=>x.id)){const m=new Map();a.forEach(x=>m.set(x.id,x));b.forEach(x=>{m.set(x.id,m.has(x.id)?LOCAL.mergeVal(m.get(x.id),x,path.concat(x.id),conf):x)});return [...m.values()]}
      const seen=new Set();const out=[];[...a,...b].forEach(x=>{const k=JSON.stringify(x);if(!seen.has(k)){seen.add(k);out.push(x)}});return out.every(x=>typeof x==="string")&&out.every(x=>/^\d{4}-\d{2}-\d{2}$/.test(x))?out.sort():out}
    if(a&&b&&typeof a==="object"&&typeof b==="object"){const o={};new Set([...Object.keys(a),...Object.keys(b)]).forEach(k=>{o[k]=LOCAL.mergeVal(a[k],b[k],path.concat(k),conf)});return o}
    conf.push({path,mine:a,theirs:b});return a},
  prune(o,tomb){if(Array.isArray(o))return o.filter(x=>!(x&&typeof x==="object"&&x.id&&tomb.has(x.id))).map(x=>LOCAL.prune(x,tomb));if(o&&typeof o==="object"){const r={};Object.entries(o).forEach(([k,v])=>r[k]=LOCAL.prune(v,tomb));return r}return o},
  label(path){const [col,id,...rest]=path;let who=col==="children"?(S.children.get(id)||{}).name:col==="groups"?(S.groups.get(id)||{}).name:"Paramètres";
    const L={name:"Prénom",dob:"Date de naissance",langues:"Langues",alias:"Variantes du prénom",avatar:"Avatar",template:"Fiche",emblem:"Emblème",equipe:"Équipe",synth:"Synthèse",forces:"forces",soutien:"ce qu'on soutient",fonctionne:"ce qui fonctionne",corps:"Corps",coeur:"Cœur",tete:"Tête",esprit:"Esprit",ctx:"Contexte du jour",objRes:"Objectif de groupe",marks:"Suivi d'objectif",text:"Texte",label:"Intitulé",done:"Atteint",prio:"Ordre de priorité",hide:"Éléments masqués",lvl:"Repères adaptés",maj:"date de mise à jour",theme:"Thème"};
    return (who||"")+" · "+rest.filter(x=>!/^[a-z]\w{7,}$/.test(x)||L[x]).map(x=>L[x]||(/^\d{4}-\d{2}-\d{2}$/.test(x)?fmtD(x,true):x)).join(" · ")},
  show(v){if(v===undefined||v===null||v==="")return "(vide)";if(typeof v==="string")return v==="ok"?"✓ réussi":v==="no"?"✗ pas encore":v;return JSON.stringify(v).slice(0,140)},
  async merge(f){const d=await LOCAL.readFile(f);if(!d)return;if(d.photosOnly){LOCAL.importPhotos(d);return}
    const tomb=new Set([...(LOCAL.meta.tomb||[]),...(d.tomb||[])]);const mine={};LOCAL.cache.forEach((v,k)=>mine[k]=v);const conf=[];const out={};
    new Set([...Object.keys(mine),...Object.keys(d.docs)]).forEach(k=>{if(tomb.has(k.split("/").pop()))return;out[k]=LOCAL.prune(LOCAL.mergeVal(mine[k],d.docs[k],k.split("/"),conf),tomb)});
    const conflicts=conf.filter(c=>!(c.path.includes("maj")));
    const finish=async()=>{LOCAL.meta.tomb=[...tomb];const nNew=Object.keys(d.docs).filter(k=>!mine[k]).length;await LOCAL.writeAll(out,d.photos)};
    if(!conflicts.length){confirmSheetCustom(`Fusionner la sauvegarde${d.by?" de "+d.by:""} (${fmtD(String(d.exportedAt).slice(0,10),true)}) ? Tout sera combiné : les cases, notes, photos et objectifs des deux carnets, sans doublons.`,"Fusionner",finish);return}
    openSheet(`<h3>À trancher (${conflicts.length})</h3><p class="muted small" style="margin:0">Tout le reste a été combiné automatiquement. Pour ces éléments, les deux carnets ont une valeur différente : choisissez laquelle garder.</p>
    <div class="review">${conflicts.map((c,i)=>`<div class="ritem"><b class="small">${esc(LOCAL.label(c.path))}</b>
      <label class="chk"><input type="radio" name="cf${i}" value="mine" checked> <span><span class="muted small">Ici :</span> ${esc(LOCAL.show(c.mine))}</span></label>
      <label class="chk"><input type="radio" name="cf${i}" value="theirs"> <span><span class="muted small">${esc(d.by||"Sauvegarde")} :</span> ${esc(LOCAL.show(c.theirs))}</span></label>
      ${typeof c.mine==="string"&&typeof c.theirs==="string"&&c.mine.length>12?`<label class="chk"><input type="radio" name="cf${i}" value="both"> Garder les deux textes</label>`:""}</div>`).join("")}</div>
    <div class="row-actions"><button class="btn primary" id="cfOk">Fusionner</button><button class="btn" id="cfNo">Annuler</button></div>`,s=>{
      s.querySelector("#cfNo").onclick=closeSheet;
      s.querySelector("#cfOk").onclick=async()=>{conflicts.forEach((c,i)=>{const ch=(s.querySelector(`input[name=cf${i}]:checked`)||{}).value;if(ch==="mine")return;const val=ch==="both"?c.mine+"\n— "+(d.by||"collègue")+" : "+c.theirs:c.theirs;
        const [col,id,...rest]=c.path;let o=out[col+"/"+id];if(!o)return;const walk=(obj,keys)=>{if(!obj)return;const k=keys[0];if(keys.length===1){if(Array.isArray(obj)){const it=obj.find(x=>x&&x.id===k);if(it!==undefined)return}obj[k]=val;return}const next=Array.isArray(obj)?obj.find(x=>x&&x.id===k):obj[k];walk(next,keys.slice(1))};walk(o,rest)});
        closeSheet();await finish()}})}
};
